name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-18-dev libclang-18-dev unzip
    - name: Install cvc5
      # Ubuntu's libcvc5-dev package (1.3.2-1build1) is built without --poly,
      # so cvc5's --nl-cov option (which this project relies on — see
      # docs/design-decisions.md and src/solver/mod.rs) fails with
      # "Cannot use --nl-cov due to configuring without --poly". Install the
      # same official prebuilt release the Dockerfile uses instead (kept in
      # lockstep with it — see Dockerfile for the full rationale and version
      # pinning notes).
      run: |
        curl -fsSL -o /tmp/cvc5.zip \
          https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.1/cvc5-Linux-x86_64-shared.zip
        unzip -q /tmp/cvc5.zip -d /tmp/cvc5-extracted
        sudo cp -r /tmp/cvc5-extracted/cvc5-Linux-x86_64-shared/include/. /usr/local/include/
        sudo cp -P /tmp/cvc5-extracted/cvc5-Linux-x86_64-shared/lib/*.so* /usr/local/lib/
        sudo ldconfig
        rm -rf /tmp/cvc5.zip /tmp/cvc5-extracted
        echo "CVC5_LIB_DIR=/usr/local/lib" >> "$GITHUB_ENV"

    - name: Check fmt
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

    - name: Install llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Coverage
      # Coverage-instrumented binaries run markedly slower than the plain
      # `cargo test` above, which pushes otherwise-healthy checks past the
      # check worker's default progress budget (src/solver/worker.rs);
      # widening it for this step only cuts down on those false-positive
      # kills. But two solver_timeout tests set their own tight
      # CANTOR_PROGRESS_BUDGET_MS to deliberately force a kill, regardless of
      # this env var — SIGKILL always discards that worker's unflushed
      # .profraw, so a corrupt profile here is expected, not a bug.
      # --failure-mode=all tells the merge step to tolerate that instead of
      # aborting the moment any single input is corrupt (its default).
      env:
        CANTOR_PROGRESS_BUDGET_MS: "300000"
      run: cargo llvm-cov --html --failure-mode all

    # Deliberately the debug profile, matching the `cantor` binary `cargo
    # build` already produced above: `cantor build --target wasm32` links
    # against a cross-compiled cantor-runtime of the *same* profile, and a
    # release build of the whole compiler (LLVM + cvc5 bindings) costs far
    # more CI time than the ~2x larger demo module is worth.
    - name: Build the wasm demos
      run: |
        rustup target add wasm32-unknown-unknown
        cargo build -p cantor-runtime --target wasm32-unknown-unknown
        ./target/debug/cantor build --target wasm32 examples/parrot.cantor -o web/parrot.wasm
        ./target/debug/cantor build --target wasm32 examples/game_of_life.cantor -o web/game_of_life.wasm
    - name: Assemble the Pages site
      # Root is a landing page linking out; coverage lives under /coverage,
      # demos under /demo. The demo pages fetch their own .cantor source to
      # display, so it ships alongside them — `web/*.cantor` are symlinks into
      # examples/, which `cp` dereferences into real files here.
      run: |
        mkdir -p site/coverage site/demo
        cp .github/pages/index.html site/
        cp -r target/llvm-cov/html/. site/coverage/
        cp web/index.html web/game-of-life.html web/cantor.js site/demo/
        cp web/parrot.wasm web/game_of_life.wasm site/demo/
        cp web/parrot.cantor web/game_of_life.cantor site/demo/

    - name: Setup Pages
      uses: actions/configure-pages@v5
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
